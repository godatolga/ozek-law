<script id="oz-engine">/* ============================================================
   OZEK LAW FIRM — PROPOSAL ENGINE
   Renders the proposal from the JSON in #oz-data.
   Press Ctrl+E (or add #edit to the address) to edit and re-save.
   ============================================================ */
var OZ = (function () {
  'use strict';

  var $ = function (id) { return document.getElementById(id); };
  var readJSON = function (id) { return JSON.parse($(id).textContent); };

  var A = {}, D = {}, SHELL = {};
  var lang = 'tr';
  var editing = false;

  /* ---------- helpers ---------- */
  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }
  function nl(s) { return esc(s).replace(/\n/g, '<br>'); }
  function el(tag, attrs, html) {
    var e = document.createElement(tag);
    if (attrs) for (var k in attrs) { if (attrs[k] != null) e.setAttribute(k, attrs[k]); }
    if (html != null) e.innerHTML = html;
    return e;
  }
  function codeMarkup(code) {
    // renders "EB-2 NIW" with a gold hyphen, like the O-1 proposal
    return esc(code).replace(/-/g, '<span class="gold">-</span>');
  }

  /* ---------- section builders ---------- */

  function sGate(t) {
    return '' +
      '<div id="oz-gate" class="oz-gate">' +
        '<div class="oz-gate-in">' +
          '<img src="' + A.logo + '" alt="Ozek Law Firm" class="oz-gate-logo">' +
          '<div class="eyebrow gold">' + esc(t.gate.eyebrow) + '</div>' +
          '<h1 class="oz-gate-h1">' + esc(t.gate.title) + '</h1>' +
          '<p class="oz-gate-p">' + esc(t.gate.subtitle) + '</p>' +
          '<input id="oz-pw" type="password" placeholder="' + esc(t.gate.placeholder) + '" autocomplete="off">' +
          '<div id="oz-pw-err" class="oz-pw-err">' + esc(t.gate.error) + '</div>' +
          '<button id="oz-unlock" class="oz-btn-gold">' + esc(t.gate.button) + '</button>' +
          '<div class="oz-gate-hint">' + esc(t.gate.hint) + '</div>' +
        '</div>' +
      '</div>';
  }

  function sNav(t) {
    var links = [
      ['#approach', t.nav.approach], ['#overview', t.nav.overview],
      ['#process', t.nav.process], ['#fees', t.nav.fees], ['#faq', t.nav.faq]
    ].map(function (l) { return '<a class="oznav" href="' + l[0] + '">' + esc(l[1]) + '</a>'; }).join('');
    return '' +
      '<nav class="oz-nav">' +
        '<a href="#top" class="oz-nav-logo"><img src="' + A.logo + '" alt="Ozek Law Firm"></a>' +
        '<div class="oz-nav-right">' + links +
          '<div class="oz-lang">' +
            '<button data-lang="tr" class="' + (lang === 'tr' ? 'on' : '') + '">TR</button>' +
            '<button data-lang="en" class="' + (lang === 'en' ? 'on' : '') + '">EN</button>' +
          '</div>' +
        '</div>' +
      '</nav>';
  }

  function sHero(t) {
    return '' +
      '<header id="top" class="oz-hero">' +
        '<div class="oz-hero-img" style="background-image:url(' + A.hero + ')"></div>' +
        '<div class="oz-hero-veil"></div><div class="oz-hero-rule"></div>' +
        '<div class="oz-hero-top"><img class="oz-herologo" src="' + A.logo + '" alt="Ozek Law Firm"></div>' +
        '<div class="oz-hero-bot">' +
          '<div class="eyebrow gold wide">' + esc(t.hero.eyebrow) + '</div>' +
          '<div class="oz-hero-block">' +
            '<h1 class="oz-hero-code">' + codeMarkup(D.meta.code) + '</h1>' +
            '<div class="oz-hero-em">' + esc(t.hero.titleEm) + '</div>' +
            '<div class="oz-beam"><span></span></div>' +
          '</div>' +
          '<p class="oz-hero-sub">' + esc(t.hero.sub) + '</p>' +
          '<div class="oz-hero-meta">' +
            '<span class="yr">' + esc(D.meta.year) + '</span><span class="dot"></span>' +
            '<span>' + esc(t.hero.offices) + '</span><span class="dot"></span>' +
            '<span>www.ozeklaw.com</span>' +
          '</div>' +
        '</div>' +
      '</header>';
  }

  function sContents(t) {
    var items = t.contents.items.map(function (i) {
      return '<a class="oz-toc-i" href="' + esc(i.anchor) + '">' +
        '<span class="n">' + esc(i.num) + '</span><span><span class="t">' + esc(i.title) +

    return '' +
      '<section class="oz-sec dark">' +
        '<div class="oz-wrap">' +
          '<div class="eyebrow gold wide">' + esc(t.contents.eyebrow) + '</div>' +
          '<h2 class="oz-h2 light">' + esc(t.contents.title) + '</h2>' +

              '<div class="bar"></div>' +
              '<div><div class="q">' + esc(t.contents.note) + '</div>' +
              '<div class="eyebrow gold sm">' + esc(D.meta.code) + ' &middot; ' + esc(t.meta.label) + ' &middot; ' + esc(D.meta.year) + '</div></div>' +
            '</div>' +
          '</div>' +
        '</div>' +
      '</section>';
  }

  function sApproach(t) {
    var paras = t.approach.paras.map(function (p) { return '<p>' + esc(p) + '</p>'; }).join('');

        '<div class="oz-wrap">' +
          '<div class="eyebrow gold wide">' + esc(t.approach.eyebrow) + '</div>' +

              '<div class="oz-appr-img"><img src="' + A.approach + '" alt=""></div>' +
              '<div class="oz-qbox">' +
                '<div class="eyebrow gold sm">' + esc(t.approach.qTitle) + '</div>' +
                '<ol class="oz-qlist">' + qs + '</ol>' +
              '</div>' +
            '</div>' +
          '</div>' +
        '</div>' +
      '</section>';
  }

  function sOverview(t) {
    var cards = t.overview.cards.map(function (c) {

          '<div class="hd"><span class="badge">' + esc(c.code) + '</span>' +

        '</div></div>';
    }).join('');
    var strip = (t.overview.strip || []).map(function (s) {
      return '<div class="oz-strip"><span class="badge sm">' + esc(s.code) + '</span>' +
        '<div><h4>' + esc(s.title) + '</h4><p>' + esc(s.body) + '</p></div></div>';
    }).join('');
    var facts = t.overview.facts.map(function (f) {
      return '<div class="oz-fact"><span class="sq"></span><h4>' + esc(f.title) + '</h4><p>' + esc(f.body) + '</p></div>';

      return '<div class="oz-qual' + (i ? ' b' : '') + '">' +
        '<div class="eyebrow sm ' + (i ? 'navy' : 'gold') + '">' + esc(c.tag) + '</div>' +
        '<h4>' + esc(c.title) + '</h4><ul>' + items + '</ul></div>';
    }).join('');
    return '' +
      '<section id="overview" class="oz-sec sand">' +
        '<div class="oz-wrap">' +
          '<div class="eyebrow gold wide">' + esc(t.overview.eyebrow) + '</div>' +
          '<h2 class="oz-h2">' + esc(t.overview.title) + '</h2>' +
          '<p class="oz-lead">' + esc(t.overview.intro) + '</p>' +
          '<div class="oz-ovgrid">' + cards + '</div>' +
          (strip ? '<div class="oz-ovgrid strip">' + strip + '</div>' : '') +
          '<div class="oz-facts">' + facts + '</div>' +
          '<h3 class="oz-h3">' + esc(t.qualify.title) + '</h3>' +

          '<div class="oz-qualgrid">' + cols + '</div>' +
          '<div class="oz-crit"><div class="bar"></div><p>' + esc(t.qualify.criteria) + '</p></div>' +

  function sProcess(t) {

    var ph = t.timeline.phases.map(function (p) {

        '<div class="num">' + esc(p.num) + '</div>' +

        '</div><div class="bd"><h3>' + esc(p.title) + '</h3><p>' + esc(p.body) + '</p></div></div>';
    }).join('');

      '<section id="process" class="oz-sec dark">' +
        '<div class="oz-wrap">' +
          '<div class="eyebrow gold wide">' + esc(t.timeline.eyebrow) + '</div>' +
          '<h2 class="oz-h2 light">' + esc(t.timeline.title) + '</h2>' +
          '<p class="oz-lead dk">' + esc(t.timeline.intro) + '</p>' +
          '<div class="oz-legend">' +
            '<span class="lg gold"><i class="fill"></i>' + esc(t.timeline.legendEvid) + '</span>' +
            '<span class="lg blue"><i class="line"></i>' + esc(t.timeline.legendUscis) + '</span>' +
          '</div>' +
          '<div class="oz-phases">' + ph + '</div>' +
        '</div>' +
      '</section>';
  }

  function sBanner(t) {
    var chips = t.banner.chips.map(function (c) { return '<span class="chip">' + esc(c) + '</span>'; }).join('');
    return '' +
      '<section class="oz-sec cream">' +
        '<div class="oz-wrap oz-banner">' +
          '<div>' +
            '<div class="eyebrow gold sm">' + esc(t.banner.eyebrow) + '</div>' +
            '<h3 class="oz-h3 tight">' + esc(t.banner.title) + '</h3>' +
            '<p class="oz-bnr-p">' + esc(t.banner.body) + '</p>' +
            '<div class="oz-chips">' + chips + '</div>' +
          '</div>' +
          '<div class="oz-bnr-img"><img src="' + A.banner + '" alt=""></div>' +
        '</div>' +
      '</section>';
  }

  function feeCol(fees, big) {
    return fees.map(function (f) {
      return '<div><span class="amt' + (big ? ' b' : '') + '">' + esc(f.amount) + '</span>' +
        '<span class="lbl">' + esc(f.label) + '</span></div>';
    }).join('');
  }

  function sFees(t) {
    var rows = t.fees.rows.map(function (r) {
      return '<div class="oz-fees-grid oz-fees-row">' +
        '<div>' + (r.stage ? '<div class="eyebrow gold xs">' + esc(r.stage) + '</div>' : '') +
          '<div class="svc">' + esc(r.service) + '</div>' +
          (r.sub ? '<div class="sub">' + esc(r.sub) + '</div>' : '') + '</div>' +
        '<div class="fcol">' + feeCol(r.fees) + '</div>' +
        '<div class="note">' + esc(r.note) + '</div></div>';
    }).join('');
    var pays = t.fees.payments.map(function (p) {
      return '<div class="oz-pay"><div class="hd"><span class="n">' + esc(p.n) + '</span>' +
        '<span class="when">' + esc(p.when) + '</span></div>' +
        '<div class="ttl">' + esc(p.title) + '</div><div class="amt">' + esc(p.amount) + '</div></div>';
    }).join('');
    return '' +
      '<section id="fees" class="oz-sec sand">' +
        '<div class="oz-wrap">' +
          '<div class="eyebrow gold wide">' + esc(t.fees.eyebrow) + '</div>' +
          '<h2 class="oz-h2">' + esc(t.fees.title) + '</h2>' +
          '<p class="oz-lead">' + esc(t.fees.intro) + '</p>' +
          '<div class="oz-fees-grid oz-fees-head">' +
            '<div>' + esc(t.fees.colService) + '</div><div>' + esc(t.fees.colFee) + '</div><div>' + esc(t.fees.colNote) + '</div>' +
          '</div>' + rows +
          '<div class="oz-fees-grid oz-fees-total">' +
            '<div class="lab">' + esc(t.fees.total.label) + '</div>' +
            '<div class="fcol">' + feeCol(t.fees.total.fees, true) + '</div>' +
            '<div class="note">' + esc(t.fees.total.note) + '</div>' +
          '</div>' +
          '<div class="oz-payblock">' +
            '<div class="badge"><span class="d"></span>' + esc(t.fees.payBadge) + '</div>' +
            '<h3>' + esc(t.fees.payTitle) + '</h3>' +
            '<p>' + esc(t.fees.paySub) + '</p>' +
            '<div class="oz-pays">' + pays + '</div>' +
          '</div>' +
        '</div>' +
      '</section>';
  }

  function sChecklist(t) {
    var g = t.checklist.groups.map(function (g) {
      var items = g.items.map(function (i) { return '<li><span class="bx"></span><span>' + esc(i) + '</span></li>'; }).join('');
      return '<div class="oz-cl"><div class="hd"><span class="n">' + esc(g.num) + '</span><h4>' + esc(g.title) + '</h4></div><ul>' + items + '</ul></div>';
    }).join('');
    return '' +
      '<section id="checklist" class="oz-sec cream">' +
        '<div class="oz-wrap">' +
          '<div class="eyebrow gold wide">' + esc(t.checklist.eyebrow) + '</div>' +
          '<h2 class="oz-h2">' + esc(t.checklist.title) + '</h2>' +
          '<p class="oz-lead">' + esc(t.checklist.intro) + '</p>' +
          '<div class="oz-clgrid">' + g + '</div>' +
        '</div>' +
      '</section>';
  }

  function sFaq(t) {
    var items = t.faq.items.map(function (f) {
      return '<div class="oz-faq"><div class="n">' + esc(f.n) + '</div><div><h3>' + esc(f.q) + '</h3><p>' + esc(f.a) + '</p></div></div>';
    }).join('');
    return '' +
      '<section id="faq" class="oz-sec dark">' +
        '<div class="oz-wrap narrow">' +
          '<div class="eyebrow gold wide">' + esc(t.faq.eyebrow) + '</div>' +
          '<h2 class="oz-h2 light">' + esc(t.faq.title) + '</h2>' +
          '<div>' + items + '</div>' +
        '</div>' +
      '</section>';
  }

  function sDisclaimer(t) {
    var items = t.disclaimer.items.map(function (d) { return '<p>' + esc(d) + '</p>'; }).join('');
    return '' +
      '<section class="oz-sec sand">' +
        '<div class="oz-wrap tiny">' +
          '<div class="eyebrow gold wide">' + esc(t.disclaimer.eyebrow) + '</div>' +
          '<h2 class="oz-h2 sm">' + esc(t.disclaimer.title) + '</h2>' +
          '<div class="oz-disc">' + items + '</div>' +
          '<div class="oz-valid"><span class="n">' + esc(D.meta.validityDays) + '</span><span>' + esc(t.disclaimer.validity) + '</span></div>' +
        '</div>' +
      '</section>';
  }

  function sTeam(t) {
    var members = D.meta.team.map(function (m) {
      return '<div class="oz-tm"><div class="ph"><img src="' + A[m.img] + '" alt="' + esc(m.name) + '"></div>' +
        '<div class="nm">' + esc(m.name) + '</div><div class="rl">Ozek Law Firm</div></div>';
    }).join('');
    var awards = ['award2022', 'award2023', 'award2024', 'award2025'].map(function (k) {
      return '<img class="oz-aw" src="' + A[k] + '" alt="Avvo Clients Choice Award">';
    }).join('');
    return '' +
      '<section class="oz-sec cream center">' +
        '<div class="oz-wrap">' +
          '<div class="eyebrow gold wide">' + esc(t.team.eyebrow) + '</div>' +
          '<h2 class="oz-h2 mid">' + esc(t.team.title) + '</h2>' +
          '<div class="oz-team">' + members + '</div>' +
          '<div class="oz-awards"><div class="eyebrow grey">' + esc(t.team.awardsTitle) + '</div>' +
            '<div class="row">' + awards +
              '<div class="oz-stars"><div class="s">&#9733;&#9733;&#9733;&#9733;&#9733;</div>' +
              '<div class="t">' + esc(t.team.stars) + '</div><div class="g">' + esc(t.team.starsSub) + '</div></div>' +
            '</div></div>' +
        '</div>' +
      '</section>';
  }

  function sContact(t) {
    return '' +
      '<footer id="contact" class="oz-foot">' +
        '<div class="oz-wrap center">' +
          '<img class="oz-foot-logo" src="' + A.logo + '" alt="Ozek Law Firm">' +
          '<div class="eyebrow gold wide">' + esc(t.contact.eyebrow) + '</div>' +
          '<h2 class="oz-h2 light mid">' + esc(t.contact.title) + '</h2>' +
          '<p class="oz-foot-p">' + esc(t.contact.body) + '</p>' +
          '<div class="oz-foot-cols">' +
            '<a href="tel:+12028548545"><div class="k">' + esc(t.contact.phoneLabel) + '</div><div class="v">+1 202 854 8545</div></a>' +
            '<a href="mailto:info@ozeklaw.com"><div class="k">' + esc(t.contact.emailLabel) + '</div><div class="v">info@ozeklaw.com</div></a>' +
            '<div><div class="k">' + esc(t.contact.officeLabel) + '</div><div class="v">Bethesda, MD</div>' +
            '<div class="s">4500 East West Highway, Ste 150, Bethesda, MD 20814</div></div>' +
          '</div>' +
          '<a class="oz-cta" href="mailto:info@ozeklaw.com">' + esc(t.contact.cta) + '</a>' +
          '<div class="oz-foot-bar"><span>' + esc(t.contact.officesFooter) + '</span><span>' + esc(t.contact.copyright) + '</span></div>' +
          '<p class="oz-legal">' + esc(t.contact.legal) + '</p>' +
        '</div>' +
      '</footer>';
  }

  /* ---------- render ---------- */
  function render() {
    var t = D[lang] || D.en;
    document.title = 'Ozek Law Firm — ' + D.meta.code + ' ' + (t.meta.docTitle || 'Proposal');
    document.documentElement.lang = lang;
    var locked = !editing && !unlockedFlag();
    $('oz-root').innerHTML =
      (locked ? sGate(t) : '') + sNav(t) + sHero(t) + sContents(t) + sApproach(t) +
      sOverview(t) + sProcess(t) + sBanner(t) + sFees(t) + sChecklist(t) +
      sFaq(t) + sDisclaimer(t) + sTeam(t) + sContact(t);
    if (locked) { wireGate(); document.body.style.overflow = 'hidden'; }
    else { document.body.style.overflow = ''; }
    Array.prototype.forEach.call(document.querySelectorAll('.oz-lang button'), function (b) {
      b.onclick = function () {
        lang = b.getAttribute('data-lang');
        try { localStorage.setItem('ozp_lang', lang); } catch (e) {}
        render(); if (editing) buildEditor();
      };
    });
  }

  function unlockedFlag() {
    if (!D.meta.code_word) return true;
    try { return sessionStorage.getItem('ozp_open_' + D.meta.slug) === '1'; } catch (e) { return false; }
  }

  function wireGate() {
    var inp = $('oz-pw'), btn = $('oz-unlock'), err = $('oz-pw-err');
    function go() {
      if ((inp.value || '').trim().toLowerCase() === String(D.meta.code_word).toLowerCase()) {
        try { sessionStorage.setItem('ozp_open_' + D.meta.slug, '1'); } catch (e) {}
        render(); window.scrollTo(0, 0);
      } else { err.style.display = 'block'; }
    }
    btn.onclick = go;
    inp.onkeydown = function (e) { if (e.key === 'Enter') go(); };
    inp.oninput = function () { err.style.display = 'none'; };
    setTimeout(function () { inp.focus(); }, 60);
  }

  /* ============================================================
     EDIT MODE
     ============================================================ */
  var LABELS = {
    meta: 'Document settings', gate: 'Access screen', nav: 'Menu',
    hero: 'Cover', contents: 'Table of contents', approach: 'Our approach',
    overview: 'Overview', qualify: 'Who qualifies', timeline: 'Process',
    banner: 'Mid-page banner', fees: 'FEES & PAYMENT SCHEDULE',
    checklist: 'Document checklist', faq: 'FAQ', disclaimer: 'Disclosure',
    team: 'Team', contact: 'Contact'
  };
  var ORDER = ['fees', 'hero', 'overview', 'qualify', 'timeline', 'checklist', 'faq',
               'contents', 'approach', 'banner', 'disclaimer', 'team', 'contact', 'gate', 'nav', 'meta'];
  var BIG = { body: 1, note: 1, a: 1, text: 1, intro: 1, sub: 1, subtitle: 1, criteria: 1, legal: 1, paySub: 1 };

  function pretty(k) {
    if (typeof k === 'number') return 'Text';
    return String(k).replace(/([A-Z])/g, ' $1').replace(/^./, function (c) { return c.toUpperCase(); });
  }

  function field(obj, key, path) {
    var v = obj[key];
    var wrap = el('label', { 'class': 'ozed-f' });
    wrap.appendChild(el('span', { 'class': 'ozed-k' }, esc(pretty(key))));
    var big = BIG[key] || (typeof v === 'string' && v.length > 90);
    var inp = el(big ? 'textarea' : 'input');
    if (!big) inp.type = 'text';
    inp.value = v == null ? '' : v;
    inp.oninput = function () { obj[key] = inp.value; if (big) autosize(inp); };
    if (big) setTimeout(function () { autosize(inp); }, 0);
    wrap.appendChild(inp);
    return wrap;
  }
  function autosize(ta) { ta.style.height = 'auto'; ta.style.height = (ta.scrollHeight + 4) + 'px'; }

  function blankLike(sample) {
    if (typeof sample === 'string') return '';
    var o = {};
    for (var k in sample) {
      o[k] = Array.isArray(sample[k]) ? [] : (typeof sample[k] === 'object' && sample[k] ? {} : '');
    }
    return o;
  }

  function nodeFor(container, obj, key, depth) {
    var v = obj[key];
    if (v == null) return;
    if (typeof v === 'string' || typeof v === 'number') {
      container.appendChild(field(obj, key, ''));
      return;
    }
    if (Array.isArray(v)) {
      var box = el('div', { 'class': 'ozed-arr' });
      var hd = el('div', { 'class': 'ozed-arrhd' });
      hd.appendChild(el('span', {}, esc(pretty(key)) + ' <em>(' + v.length + ')</em>'));
      var add = el('button', { 'class': 'ozed-add', type: 'button' }, '+ Add');
      add.onclick = function () {
        v.push(blankLike(v[v.length - 1] != null ? v[v.length - 1] : ''));
        buildEditor(); render();
      };
      hd.appendChild(add);
      box.appendChild(hd);
      v.forEach(function (item, i) {
        var card = el('div', { 'class': 'ozed-card' });
        var ch = el('div', { 'class': 'ozed-cardhd' });
        ch.appendChild(el('span', {}, '#' + (i + 1)));
        var tools = el('span', { 'class': 'ozed-tools' });
        ['↑', '↓', '✕'].forEach(function (sym, si) {
          var b = el('button', { type: 'button', title: si === 2 ? 'Delete' : 'Move' }, sym);
          b.onclick = function () {
            if (si === 2) { if (confirm('Delete item #' + (i + 1) + '?')) v.splice(i, 1); }
            else {
              var j = si === 0 ? i - 1 : i + 1;
              if (j < 0 || j >= v.length) return;
              var tmp = v[i]; v[i] = v[j]; v[j] = tmp;
            }
            buildEditor(); render();
          };
          tools.appendChild(b);
        });
        ch.appendChild(tools);
        card.appendChild(ch);
        if (typeof item === 'string') {
          card.appendChild(field(v, i, ''));
        } else {
          for (var kk in item) nodeFor(card, item, kk, depth + 1);
        }
        box.appendChild(card);
      });
      container.appendChild(box);
      return;
    }
    // plain object
    var grp = el('div', { 'class': 'ozed-grp' });
    grp.appendChild(el('div', { 'class': 'ozed-grph' }, esc(pretty(key))));
    for (var k2 in v) nodeFor(grp, v, k2, depth + 1);
    container.appendChild(grp);
  }

  function buildEditor() {
    var body = $('ozed-body');
    body.innerHTML = '';
    var t = D[lang];

    // meta first (document-level)
    var metaSec = el('details', { 'class': 'ozed-sec' });
    metaSec.appendChild(el('summary', {}, LABELS.meta));
    ['code', 'slug', 'year', 'validityDays', 'code_word', 'defaultLang'].forEach(function (k) {
      if (D.meta[k] != null) metaSec.appendChild(field(D.meta, k, ''));
    });
    body.appendChild(metaSec);

    ORDER.forEach(function (sec) {
      if (sec === 'meta' || !t[sec]) return;
      var d = el('details', { 'class': 'ozed-sec' + (sec === 'fees' ? ' hot' : '') });
      if (sec === 'fees') d.open = true;
      d.appendChild(el('summary', {}, LABELS[sec] || pretty(sec)));
      for (var k in t[sec]) nodeFor(d, t[sec], k, 0);
      body.appendChild(d);
    });
  }

  function openEditor() {
    if (editing) return;
    editing = true;
    try { sessionStorage.setItem('ozp_open_' + D.meta.slug, '1'); } catch (e) {}
    document.body.classList.add('ozed-on');
    var p = el('div', { id: 'ozed' });
    p.innerHTML =
      '<div class="ozed-hd">' +
        '<div><strong>EDIT MODE</strong><span class="ozed-lang">' +
          '<button data-el="tr">TR</button><button data-el="en">EN</button></span></div>' +
        '<div class="ozed-act">' +
          '<button id="ozed-save" class="save">Save HTML</button>' +
          '<button id="ozed-close">Close</button>' +
        '</div>' +
      '</div>' +
      '<div class="ozed-tip">Changes preview live on the right. <b>Save HTML</b> downloads a new copy of this file with your edits baked in &mdash; replace the old file with it.</div>' +
      '<div id="ozed-body"></div>';
    document.body.appendChild(p);
    Array.prototype.forEach.call(p.querySelectorAll('.ozed-lang button'), function (b) {
      b.onclick = function () { lang = b.getAttribute('data-el'); syncLangBtns(); render(); buildEditor(); };
    });
    $('ozed-close').onclick = closeEditor;
    $('ozed-save').onclick = saveFile;
    syncLangBtns();
    buildEditor();
    render();
    // live-refresh preview as you type
    p.addEventListener('input', function () { clearTimeout(p._tm); p._tm = setTimeout(render, 260); });
  }
  function syncLangBtns() {
    Array.prototype.forEach.call(document.querySelectorAll('.ozed-lang button'), function (b) {
      b.className = b.getAttribute('data-el') === lang ? 'on' : '';
    });
  }
  function closeEditor() {
    editing = false;
    var p = $('ozed'); if (p) p.parentNode.removeChild(p);
    document.body.classList.remove('ozed-on');
    if (location.hash === '#edit') history.replaceState(null, '', location.pathname);
    render();
  }

  function jsonForScript(o) {
    return JSON.stringify(o, null, 1).replace(/<\//g, '<\\/');
  }

  function serialize() {
    var s = SHELL;
    return s.pre +
      '\n<script id="oz-shell" type="application/json">' + jsonForScript(SHELL) + '<\/script>' +
      '\n<script id="oz-assets" type="application/json">' + $('oz-assets').textContent + '<\/script>' +
      '\n<script id="oz-data" type="application/json">' + jsonForScript(D) + '<\/script>' +
      '\n<style id="oz-style">' + $('oz-style').textContent + '<\/style>' +
      '\n<script id="oz-engine">' + $('oz-engine').textContent + '<\/script>' +
      s.post;
  }

  function saveFile() {
    var html = serialize();
    var blob = new Blob([html], { type: 'text/html;charset=utf-8' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'ozek_proposal_' + D.meta.slug + '.html';
    document.body.appendChild(a); a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
    var btn = $('ozed-save'), old = btn.textContent;
    btn.textContent = 'Downloaded ✓';
    setTimeout(function () { btn.textContent = old; }, 2200);
  }

  /* ---------- boot ---------- */
  function boot() {
    A = readJSON('oz-assets');
    D = readJSON('oz-data');
    SHELL = readJSON('oz-shell');
    lang = D.meta.defaultLang || 'tr';
    try { var sl = localStorage.getItem('ozp_lang'); if (sl === 'tr' || sl === 'en') lang = sl; } catch (e) {}
    render();
    document.addEventListener('keydown', function (e) {
      if ((e.ctrlKey || e.metaKey) && (e.key === 'e' || e.key === 'E')) { e.preventDefault(); editing ? closeEditor() : openEditor(); }
      if (e.key === 'Escape' && editing) closeEditor();
    });
    if (location.hash === '#edit') setTimeout(openEditor, 30);
    window.addEventListener('hashchange', function () { if (location.hash === '#edit') openEditor(); });
  }

  return { boot: boot, edit: openEditor, data: function () { return D; } };
})();
</script>
</head>
<body>
<div id="oz-root"></div>
<script>OZ.boot();</script>
